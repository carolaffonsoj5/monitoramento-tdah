<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Monitoramento · Lisdexanfetamina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Spline+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ====================== TELA DE LOGIN ====================== -->
<div id="screen-auth" class="screen">
  <div class="auth-wrap">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2f6043" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-7"/><path d="M9 9a3 3 0 0 1 6 0c0 1.7-1.3 3-3 4-1.7-1-3-2.3-3-4Z"/><path d="M5 13a3 3 0 0 0 5 2"/><path d="M19 13a3 3 0 0 1-5 2"/></svg>
      <h1>Monitoramento</h1>
      <p class="brand-sub">Resposta à Lisdexanfetamina · TDAH</p>
    </div>

    <div class="card auth-card">
      <div class="tabs">
        <button class="tab active" data-tab="login">Entrar</button>
        <button class="tab" data-tab="signup">Criar acesso</button>
      </div>

      <!-- LOGIN -->
      <form id="form-login" class="auth-form">
        <label>E-mail<input type="email" name="email" required autocomplete="username"></label>
        <label>Senha<input type="password" name="password" required autocomplete="current-password"></label>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>

      <!-- CADASTRO -->
      <form id="form-signup" class="auth-form hidden">
        <label>Seu nome<input type="text" name="name" required placeholder="Ex: Carol, João (chefe)..."></label>
        <label>Quem é você?
          <select name="role" required>
            <option value="">Selecione...</option>
            <option value="carol">Sou a Carol (paciente)</option>
            <option value="observador">Familiar / pessoa próxima</option>
            <option value="chefe">Chefe / trabalho</option>
            <option value="namorado">Namorado / parceiro(a)</option>
          </select>
        </label>
        <label id="relation-field" class="hidden">Sua relação com a Carol
          <input type="text" name="relation" placeholder="Ex: mãe, pai, amiga...">
        </label>
        <label>E-mail<input type="email" name="email" required autocomplete="username"></label>
        <label>Senha (mín. 6 caracteres)<input type="password" name="password" required minlength="6" autocomplete="new-password"></label>
        <button type="submit" class="btn-primary">Criar acesso</button>
      </form>

      <p id="auth-msg" class="msg"></p>
    </div>
    <p class="foot-note">Ferramenta de acompanhamento. Não substitui avaliação médica.</p>
  </div>
</div>

<!-- ====================== APP ====================== -->
<div id="screen-app" class="screen hidden">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="who"><span id="who-name"></span><span id="who-role" class="pill"></span></div>
      <nav class="nav">
        <button class="navbtn active" data-view="hoje">Hoje</button>
        <button class="navbtn" data-view="historico">Histórico</button>
        <button class="navbtn" data-view="relatorio">Relatório</button>
        <button class="navbtn ghost" id="btn-logout">Sair</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- VIEW: HOJE (formulário) -->
    <section id="view-hoje" class="view">
      <div class="view-head">
        <div>
          <h2 id="form-title">Registro do dia</h2>
          <p class="view-sub" id="form-sub"></p>
        </div>
        <label class="date-pick">Data
          <input type="date" id="entry-date">
        </label>
      </div>
      <form id="entry-form"></form>
      <div class="save-bar">
        <span id="save-status" class="save-status"></span>
        <button id="btn-save" class="btn-primary">Salvar registro</button>
      </div>
    </section>

    <!-- VIEW: HISTÓRICO -->
    <section id="view-historico" class="view hidden">
      <h2>Meus registros</h2>
      <p class="view-sub">Toque para abrir e editar um dia.</p>
      <div id="history-list" class="history-list"></div>
    </section>

    <!-- VIEW: RELATÓRIO -->
    <section id="view-relatorio" class="view hidden">
      <div class="view-head no-print">
        <div><h2>Relatório para o médico</h2>
        <p class="view-sub">Junta os registros de todas as pessoas no período.</p></div>
        <div class="report-controls">
          <label>De <input type="date" id="rep-from"></label>
          <label>Até <input type="date" id="rep-to"></label>
          <button id="btn-build-report" class="btn-secondary">Gerar</button>
          <button id="btn-print" class="btn-primary">Imprimir / PDF</button>
        </div>
      </div>
      <div id="report-output" class="report"></div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
